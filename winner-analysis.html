<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kalshi — Winner Analysis</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--surface:#111118;--surface2:#18181f;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--purple:#7c6ff7;--teal:#2dd4a0;--coral:#f87171;--amber:#fbbf24;--text:#e8e8f0;--muted:#6b6b80}
body{background:var(--bg);color:var(--text);font-family:'Helvetica Neue',sans-serif;font-size:14px;padding:24px;max-width:1100px;margin:0 auto}
h1{font-size:20px;font-weight:500;margin-bottom:4px}
.sub{font-size:11px;color:var(--muted);font-family:'Courier New',monospace;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:14px}
.sec{font-size:10px;color:var(--muted);font-family:'Courier New',monospace;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.btn{padding:12px 24px;border-radius:6px;border:none;font-size:14px;font-weight:500;cursor:pointer;width:100%;margin-top:6px;background:var(--amber);color:#000}
.btn:disabled{opacity:.4;cursor:not-allowed}
.prog-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:8px}
.prog-fill{height:100%;background:var(--amber);border-radius:2px;transition:width .3s;width:0}
#log{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;font-family:'Courier New',monospace;font-size:11px;color:var(--muted);min-height:60px;max-height:120px;overflow-y:auto;white-space:pre-wrap;margin-top:10px}
.ok{color:var(--teal)}.warn{color:var(--amber)}.err{color:var(--coral)}.info{color:var(--purple)}
table{width:100%;border-collapse:collapse;font-family:'Courier New',monospace;font-size:11px}
th{text-align:left;padding:6px 8px;background:var(--surface2);color:var(--muted);font-weight:500;border-bottom:1px solid var(--border)}
td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.green{color:var(--teal)}.red{color:var(--coral)}.amber{color:var(--amber)}.muted{color:var(--muted)}
.winner-card{background:var(--surface);border:1px solid rgba(45,212,160,0.3);border-radius:8px;padding:14px;margin-bottom:10px}
.winner-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.winner-pnl{font-size:18px;font-weight:600;color:var(--teal)}
.winner-meta{font-size:10px;color:var(--muted);font-family:'Courier New',monospace}
.context-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
.context-box{background:var(--surface2);border-radius:6px;padding:10px}
.context-label{font-size:9px;color:var(--muted);font-family:'Courier New',monospace;text-transform:uppercase;margin-bottom:6px}
.context-val{font-size:13px;font-weight:600;font-family:'Courier New',monospace}
.cfg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
label{font-size:11px;color:var(--muted);font-family:'Courier New',monospace;display:block;margin-bottom:4px}
input[type=number]{background:var(--bg);border:1px solid var(--border2);border-radius:5px;padding:6px 8px;color:var(--text);font-family:'Courier New',monospace;font-size:11px;width:100%}
.pattern-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px}
.bar{height:8px;border-radius:4px;background:var(--teal);display:inline-block;margin-left:8px;vertical-align:middle}
</style>
</head>
<body>
<h1>Kalshi — Winner Analysis</h1>
<div class="sub">Find what the market looked like 60 seconds before every big winning trade · reverse engineer the signal</div>

<div class="card">
<div class="sec">Configuration</div>
<div class="cfg">
<div><label>Min Win to Analyze ($)</label><input type="number" id="minwin" value="1.00" step="0.50"></div>
<div><label>Forward Window (snaps ×10s)</label><input type="number" id="fwdsnaps" value="5" step="1"></div>
<div><label>Top N Winners to Show</label><input type="number" id="topn" value="30" step="5"></div>
</div>
<button class="btn" id="runBtn" onclick="run()">Analyze Winners</button>
<div class="prog-bar"><div class="prog-fill" id="pf"></div></div>
<div id="log"></div>
</div>

<div id="out" style="display:none">

<div class="card">
<div class="sec">Pattern Summary — What Winners Have In Common</div>
<div id="patterns"></div>
</div>

<div class="card">
<div class="sec">Top Winners — Full Context 60 Seconds Before</div>
<div id="winners"></div>
</div>

</div>

<script>
const el=id=>document.getElementById(id);
function lg(msg,cls='info'){const d=el('log');d.innerHTML+='<span class="'+cls+'">'+msg+'</span>\n';d.scrollTop=d.scrollHeight;}
function prog(p){el('pf').style.width=p+'%';}
function fmtD(n){return(n>=0?'+$':'-$')+Math.abs(n).toFixed(2);}

async function proxy(body){
const r=await fetch('/api/proxy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
return r.json();
}

function parseStrike(ticker){
const m=ticker.match(/-T(\d+(?:\.\d+)?)$/);
return m?parseFloat(m[1]):null;
}

async function run(){
const btn=el('runBtn');
btn.disabled=true;
el('log').innerHTML='';
el('out').style.display='none';

const minWin=parseFloat(el('minwin').value)||1.00;
const fwdSnaps=parseInt(el('fwdsnaps').value)||5;
const topN=parseInt(el('topn').value)||30;
const fee=0.02;
const contracts=10;

try{
prog(5);
lg('Rebuilding index...','info');
const result=await proxy({_storage:true,action:'list',key:'ladder:*'});
const keys=result.result;
const snapKeys=keys.filter(k=>k!=='ladder:index'&&k!=='ladder:latest');
const timestamps=snapKeys.map(k=>k.replace('ladder:','')).sort();
await proxy({_storage:true,action:'set',key:'ladder:index',value:timestamps});
lg('Index: '+timestamps.length+' snapshots','ok');

const toLoad=timestamps.filter((_,i)=>i%2===0);
lg('Loading '+toLoad.length+' snapshots...','info');
const snaps=[];
for(let i=0;i<toLoad.length;i++){
const r=await proxy({_storage:true,action:'get',key:'ladder:'+toLoad[i]});
if(r.result){try{snaps.push(JSON.parse(r.result));}catch(e){}}
if(i%20===0)prog(5+Math.round(i/toLoad.length*55));
await new Promise(r=>setTimeout(r,15));
}
snaps.sort((a,b)=>new Date(a.ts)-new Date(b.ts));
lg('Loaded '+snaps.length+' snapshots — scanning for winners...','ok');
prog(62);

const winners=[];

for(let i=6;i<snaps.length-fwdSnaps-1;i++){
const snap=snaps[i];
if(!snap.btc_spot)continue;

const btcNow=snap.btc_spot;
const btc1=snaps[i-1].btc_spot; // 10s ago
const btc3=snaps[i-3].btc_spot; // 30s ago
const btc6=snaps[i-6].btc_spot; // 60s ago
if(!btc1||!btc3||!btc6)continue;

const btcDelta10s=btcNow-btc1;
const btcDelta30s=btcNow-btc3;
const btcDelta60s=btcNow-btc6;
if(Math.abs(btcDelta30s)>200)continue;

const exitSnap=snaps[i+fwdSnaps];
if(!exitSnap)continue;

for(const evt of(snap.events||[])){
if(evt.series!=='KXBTCD')continue;
if(evt.mins_to_resolve<=3||evt.mins_to_resolve>58)continue;

const exitEvt=(exitSnap.events||[]).find(e=>e.ticker===evt.ticker);
if(!exitEvt)continue;

// Also get the snapshot 6 steps BEFORE (60 seconds before entry)
const beforeSnap=snaps[i-6];
const beforeEvt=beforeSnap?(beforeSnap.events||[]).find(e=>e.ticker===evt.ticker):null;

for(let si=0;si<evt.strikes.length;si++){
const st=evt.strikes[si];
if(!st||!st.t)continue;
const strikePrice=parseStrike(st.t);
if(!strikePrice)continue;
if(Math.abs(strikePrice-btcNow)>800)continue;

const askNow=st.ya;
if(askNow<0.05||askNow>0.80)continue;
if(askNow===0)continue;

const exitSt=exitEvt.strikes[si];
if(!exitSt)continue;

const askExit=exitSt.ya;
const contractMove=askExit-askNow;
const pnl=(contractMove-fee)*contracts;

if(pnl>=minWin){
// Get before context
const beforeSt=beforeEvt?beforeEvt.strikes[si]:null;
const askBefore=beforeSt?beforeSt.ya:null;
const contractMove60s=askBefore?askNow-askBefore:null;

const dist=btcNow-strikePrice;

winners.push({
// Trade info
ts:snap.ts,
time:snap.ts.slice(11,19),
ticker:evt.ticker,
strikePrice,
si,
askBefore:askBefore?askBefore.toFixed(3):null,
askEntry:askNow.toFixed(3),
askExit:askExit.toFixed(3),
contractMove:contractMove.toFixed(3),
pnl:parseFloat(pnl.toFixed(2)),
mins:evt.mins_to_resolve,

// BTC context at entry
btcNow,
btcDelta10s:btcDelta10s.toFixed(1),
btcDelta30s:btcDelta30s.toFixed(1),
btcDelta60s:btcDelta60s.toFixed(1),

// Contract context
dist:dist.toFixed(0),
contractMove60s:contractMove60s?contractMove60s.toFixed(3):null,

// Volume/size context
ybs:st.ybs,
yas:st.yas,
volume:st.v,
oi:st.oi,

// Derived
side:dist>0?'ITM':'OTM',
btcDirection:btcDelta30s>10?'UP':btcDelta30s<-10?'DOWN':'FLAT',
btcMagnitude:Math.abs(btcDelta30s).toFixed(0)
});
}
}
}
if(i%50===0)prog(62+Math.round(i/snaps.length*30));
}

prog(92);
lg('Found '+winners.length+' winning trades above $'+minWin,'ok');

// Sort by P&L descending
winners.sort((a,b)=>b.pnl-a.pnl);
const top=winners.slice(0,topN);

// Pattern analysis across all winners
const patterns={
btcDirection:{UP:0,DOWN:0,FLAT:0},
side:{ITM:0,OTM:0},
minsRange:{'5-10':0,'11-20':0,'21-35':0,'36-50':0,'51+':0},
entryPrice:{'0.05-0.20':0,'0.21-0.35':0,'0.36-0.50':0,'0.51-0.65':0,'0.66-0.80':0},
contractMoving:{yes:0,no:0},
btcAbs:{'0-20':0,'21-50':0,'51-100':0,'101-200':0}
};

for(const w of winners){
patterns.btcDirection[w.btcDirection]++;
patterns.side[w.side]++;
const m=w.mins;
if(m<=10)patterns.minsRange['5-10']++;
else if(m<=20)patterns.minsRange['11-20']++;
else if(m<=35)patterns.minsRange['21-35']++;
else if(m<=50)patterns.minsRange['36-50']++;
else patterns.minsRange['51+']++;
const e=parseFloat(w.askEntry);
if(e<=0.20)patterns.entryPrice['0.05-0.20']++;
else if(e<=0.35)patterns.entryPrice['0.21-0.35']++;
else if(e<=0.50)patterns.entryPrice['0.36-0.50']++;
else if(e<=0.65)patterns.entryPrice['0.51-0.65']++;
else patterns.entryPrice['0.66-0.80']++;
if(w.contractMove60s&&Math.abs(parseFloat(w.contractMove60s))>0.05)patterns.contractMoving.yes++;
else patterns.contractMoving.no++;
const b=parseFloat(w.btcMagnitude);
if(b<=20)patterns.btcAbs['0-20']++;
else if(b<=50)patterns.btcAbs['21-50']++;
else if(b<=100)patterns.btcAbs['51-100']++;
else patterns.btcAbs['101-200']++;
}

const total=winners.length||1;

// Render pattern summary
let patHtml='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px">';

function patBlock(title,data){
const max=Math.max(...Object.values(data));
let h='<div><div style="font-size:10px;color:var(--amber);font-family:\'Courier New\',monospace;margin-bottom:8px">'+title+'</div>';
for(const[k,v]of Object.entries(data)){
const pct=Math.round(v/total*100);
const barW=Math.round(v/max*80);
h+='<div class="pattern-row"><span style="color:var(--muted)">'+k+'</span><span>'+v+' <span style="color:var(--muted)">('+pct+'%)</span><span class="bar" style="width:'+barW+'px"></span></span></div>';
}
h+='</div>';
return h;
}

patHtml+=patBlock('BTC Direction (30s before)',patterns.btcDirection);
patHtml+=patBlock('Entry Price Range',patterns.entryPrice);
patHtml+=patBlock('Minutes to Resolve',patterns.minsRange);
patHtml+=patBlock('ITM vs OTM at Entry',patterns.side);
patHtml+=patBlock('BTC Move Magnitude',patterns.btcAbs);
patHtml+=patBlock('Contract Already Moving?',patterns.contractMoving);
patHtml+='</div>';

patHtml+='<div style="margin-top:14px;padding:12px;background:var(--surface2);border-radius:6px;font-family:\'Courier New\',monospace;font-size:11px">';
patHtml+='<div style="color:var(--amber);margin-bottom:6px">KEY FINDING — The most common winner setup:</div>';

// Find dominant conditions
const domBtcDir=Object.entries(patterns.btcDirection).sort((a,b)=>b[1]-a[1])[0];
const domEntry=Object.entries(patterns.entryPrice).sort((a,b)=>b[1]-a[1])[0];
const domMins=Object.entries(patterns.minsRange).sort((a,b)=>b[1]-a[1])[0];
const domSide=Object.entries(patterns.side).sort((a,b)=>b[1]-a[1])[0];

patHtml+='<div style="color:var(--text)">BTC direction: <span style="color:var(--teal)">'+domBtcDir[0]+' ('+Math.round(domBtcDir[1]/total*100)+'% of winners)</span></div>';
patHtml+='<div style="color:var(--text)">Entry price: <span style="color:var(--teal)">'+domEntry[0]+' ('+Math.round(domEntry[1]/total*100)+'% of winners)</span></div>';
patHtml+='<div style="color:var(--text)">Time to resolve: <span style="color:var(--teal)">'+domMins[0]+' min ('+Math.round(domMins[1]/total*100)+'% of winners)</span></div>';
patHtml+='<div style="color:var(--text)">Contract position: <span style="color:var(--teal)">'+domSide[0]+' ('+Math.round(domSide[1]/total*100)+'% of winners)</span></div>';
patHtml+='</div>';

el('patterns').innerHTML=patHtml;

// Render individual winner cards
let winHtml='';
for(const w of top){
winHtml+='<div class="winner-card">';
winHtml+='<div class="winner-header">';
winHtml+='<div><div class="winner-pnl">'+fmtD(w.pnl)+' per trade</div><div class="winner-meta">'+w.time+' · '+w.ticker+'</div></div>';
winHtml+='<div style="text-align:right"><div style="font-family:\'Courier New\',monospace;font-size:11px">Strike: $'+Math.round(w.strikePrice)+'</div><div style="font-family:\'Courier New\',monospace;font-size:11px;color:var(--muted)">'+w.mins+'m to resolve · '+(w.side==='ITM'?'<span style="color:var(--teal)">ITM</span>':'<span style="color:var(--coral)">OTM</span>')+'</div></div>';
winHtml+='</div>';

winHtml+='<div class="context-grid">';

// BTC context
winHtml+='<div class="context-box">';
winHtml+='<div class="context-label">BTC Context (60s before entry)</div>';
winHtml+='<div class="context-val '+(parseFloat(w.btcDelta60s)>0?'green':'red')+'">'+( parseFloat(w.btcDelta60s)>0?'+':'')+w.btcDelta60s+' (60s)</div>';
winHtml+='<div style="font-size:10px;color:var(--muted);font-family:\'Courier New\',monospace;margin-top:4px">'+(parseFloat(w.btcDelta30s)>0?'+':'')+w.btcDelta30s+' (30s) &nbsp;'+(parseFloat(w.btcDelta10s)>0?'+':'')+w.btcDelta10s+' (10s)</div>';
winHtml+='<div style="font-size:10px;color:var(--amber);font-family:\'Courier New\',monospace;margin-top:2px">BTC: $'+w.btcNow.toFixed(0)+' · dist '+(parseFloat(w.dist)>0?'+':'')+w.dist+'</div>';
winHtml+='</div>';

// Contract context
winHtml+='<div class="context-box">';
winHtml+='<div class="context-label">Contract Price (before → entry → exit)</div>';
winHtml+='<div class="context-val">';
if(w.askBefore)winHtml+='<span style="color:var(--muted)">'+w.askBefore+'</span> → ';
winHtml+='<span style="color:var(--text)">'+w.askEntry+'</span> → <span style="color:var(--teal)">'+w.askExit+'</span>';
winHtml+='</div>';
if(w.contractMove60s){
winHtml+='<div style="font-size:10px;color:var(--muted);font-family:\'Courier New\',monospace;margin-top:4px">Contract moved '+(parseFloat(w.contractMove60s)>0?'+':'')+w.contractMove60s+' in 60s before entry</div>';
}
winHtml+='<div style="font-size:10px;color:var(--teal);font-family:\'Courier New\',monospace;margin-top:2px">+'+w.contractMove+' during trade</div>';
winHtml+='</div>';

// Liquidity context
winHtml+='<div class="context-box">';
winHtml+='<div class="context-label">Liquidity at Entry</div>';
winHtml+='<div style="font-size:10px;font-family:\'Courier New\',monospace;line-height:1.8">';
winHtml+='<div>YES bid size: <span class="amber">'+Math.round(w.ybs)+'</span></div>';
winHtml+='<div>YES ask size: <span class="amber">'+Math.round(w.yas)+'</span></div>';
winHtml+='<div>Volume: <span class="amber">'+Math.round(w.volume)+'</span></div>';
winHtml+='<div>OI: <span class="amber">'+Math.round(w.oi)+'</span></div>';
winHtml+='</div>';
winHtml+='</div>';

winHtml+='</div>';
winHtml+='</div>';
}

el('winners').innerHTML=winHtml;
prog(100);
el('out').style.display='block';
lg('Done. Showing top '+top.length+' winners.','ok');

}catch(e){
lg('ERROR: '+e.message,'err');
console.error(e);
}
btn.disabled=false;
}
</script>
</body>
</html>
