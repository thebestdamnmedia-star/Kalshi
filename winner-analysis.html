<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kalshi — Calibrated Backtest</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--surface:#111118;--surface2:#18181f;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--purple:#7c6ff7;--teal:#2dd4a0;--coral:#f87171;--amber:#fbbf24;--blue:#60a5fa;--green:#4ade80;--text:#e8e8f0;--muted:#6b6b80}
body{background:var(--bg);color:var(--text);font-family:'Helvetica Neue',sans-serif;font-size:14px;padding:24px;max-width:1100px;margin:0 auto}
h1{font-size:20px;font-weight:500;margin-bottom:4px}
.sub{font-size:11px;color:var(--muted);font-family:'Courier New',monospace;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:14px}
.sec{font-size:10px;color:var(--muted);font-family:'Courier New',monospace;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.btn{padding:12px 24px;border-radius:6px;border:none;font-size:14px;font-weight:500;cursor:pointer;width:100%;margin-top:6px;background:var(--amber);color:#000}
.btn:disabled{opacity:.4;cursor:not-allowed}
.prog-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:8px}
.prog-fill{height:100%;background:var(--amber);border-radius:2px;transition:width .3s;width:0}
#log{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;font-family:'Courier New',monospace;font-size:11px;color:var(--muted);min-height:60px;max-height:160px;overflow-y:auto;white-space:pre-wrap;margin-top:10px}
.ok{color:var(--teal)}.warn{color:var(--amber)}.err{color:var(--coral)}.info{color:var(--purple)}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.stat{background:var(--surface2);border-radius:8px;padding:14px;text-align:center}
.stat-val{font-size:22px;font-weight:600}
.stat-lbl{font-size:10px;color:var(--muted);font-family:'Courier New',monospace;margin-top:3px}
.model-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px}
.m-name{font-size:9px;font-family:'Courier New',monospace;font-weight:700;margin-bottom:4px}
.m-wr{font-size:18px;font-weight:600;margin-bottom:2px}
.m-pnl{font-size:11px;margin-bottom:2px}
.m-ann{font-size:10px;color:var(--muted);font-family:'Courier New',monospace}
.pnl-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px}
.pnl-title{font-size:10px;color:var(--muted);font-family:'Courier New',monospace;margin-bottom:12px}
.pnl-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.pnl-row:last-child{border-bottom:none}
.pnl-lbl{color:var(--muted);font-size:11px;font-family:'Courier New',monospace}
.pnl-val{font-weight:600}
table{width:100%;border-collapse:collapse;font-family:'Courier New',monospace;font-size:11px}
th{text-align:left;padding:6px 8px;background:var(--surface2);color:var(--muted);font-weight:500;border-bottom:1px solid var(--border)}
td{padding:5px 8px;border-bottom:1px solid var(--border)}
.green{color:var(--teal)}.red{color:var(--coral)}.amber{color:var(--amber)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{padding:5px 12px;border-radius:20px;font-size:10px;font-family:'Courier New',monospace;cursor:pointer;border:1px solid var(--border);color:var(--muted)}
.tab.active{color:var(--text);background:rgba(255,255,255,.08);border-color:var(--border2)}
.trow{display:grid;grid-template-columns:70px 55px 55px 70px 55px 55px 55px 60px 75px;gap:4px;padding:4px 6px;border-radius:4px;font-family:'Courier New',monospace;font-size:10px;border-bottom:1px solid var(--border)}
.trow.win{background:rgba(45,212,160,.04)}.trow.loss{background:rgba(248,113,113,.04)}.trow.head{color:var(--muted);font-size:9px}
.cfg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
label{font-size:11px;color:var(--muted);font-family:'Courier New',monospace;display:block;margin-bottom:4px}
input[type=number]{background:var(--bg);border:1px solid var(--border2);border-radius:5px;padding:6px 8px;color:var(--text);font-family:'Courier New',monospace;font-size:11px;width:100%}
</style>

function parseStrike(ticker){
const m=ticker.match(/-T(\d+(?:\.\d+)?)$/);
return m?parseFloat(m[1]):null;
}

function getFairValue(dist,mins,minObs){
// Find closest dist bucket
const distKey=DIST_BUCKETS.reduce((prev,curr)=>Math.abs(curr-dist)<Math.abs(prev-dist)?curr:prev);
// Find closest time bucket
const timeKey=TIME_BUCKETS.reduce((prev,curr)=>Math.abs(curr-mins)<Math.abs(prev-mins)?curr:prev);
const key=distKey>=0?distKey:String(distKey);
if(!FV_TABLE[key])return null;
const fv=FV_TABLE[key][timeKey];
const obs=OBS_TABLE[key]?OBS_TABLE[key][timeKey]:0;
if(fv===null||obs<minObs)return null;
return{fv,obs,distKey,timeKey};
}

async function proxy(body){
const r=await fetch('/api/proxy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
return r.json();
}

async function rebuildIndex(){
const result=await proxy({_storage:true,action:'list',key:'ladder:*'});
const keys=result.result;
if(!keys||!Array.isArray(keys))return [];
const snapKeys=keys.filter(k=>k!=='ladder:index'&&k!=='ladder:latest');
const timestamps=snapKeys.map(k=>k.replace('ladder:','')).sort();
await proxy({_storage:true,action:'set',key:'ladder:index',value:timestamps});
return timestamps;
}

function calcStats(trades,cap){
if(!trades.length)return null;
const wins=trades.filter(t=>t.pnl>0);
const losses=trades.filter(t=>t.pnl<=0);
const totalPnl=trades.reduce((s,t)=>s+t.pnl,0);
const avgWin=wins.length?wins.reduce((s,t)=>s+t.pnl,0)/wins.length:0;
const avgLoss=losses.length?losses.reduce((s,t)=>s+t.pnl,0)/losses.length:0;
let peak=cap,bal=cap,maxDD=0;
for(const t of trades){bal+=t.pnl;if(bal>peak)peak=bal;const dd=(peak-bal)/peak*100;if(dd>maxDD)maxDD=dd;}
let maxStreak=0,streak=0;
for(const t of trades){if(t.pnl<=0){streak++;if(streak>maxStreak)maxStreak=streak;}else streak=0;}
const hours=trades.length>1?(new Date(trades[trades.length-1].ts)-new Date(trades[0].ts))/(1000*3600):1;
const perDay=(totalPnl/Math.max(hours,1))*6.5;
const avgEdge=trades.filter(t=>t.edge).reduce((s,t)=>s+t.edge,0)/trades.filter(t=>t.edge).length;
return{count:trades.length,wins:wins.length,losses:losses.length,wr:(wins.length/trades.length*100).toFixed(1),totalPnl:totalPnl.toFixed(2),avgWin:avgWin.toFixed(3),avgLoss:avgLoss.toFixed(3),finalBal:(cap+totalPnl).toFixed(2),maxDD:maxDD.toFixed(1),maxStreak,perDay:perDay.toFixed(2),perYear:(perDay*252).toFixed(0),avgEdge:isNaN(avgEdge)?'0.000':avgEdge.toFixed(3)};
}

function flatPnL(trades,cap){
let bal=cap;
return trades.map(t=>{bal+=t.pnl;return Object.assign({},t,{fb:parseFloat(bal.toFixed(2))});});
}

function compPnL(trades,cap,contracts){
let bal=cap;
return trades.map(t=>{
const scale=Math.max(1,Math.floor(bal/cap)*contracts);
const scaled=t.pnl*(scale/contracts);
bal+=scaled;
return Object.assign({},t,{cp:parseFloat(scaled.toFixed(2)),cb:parseFloat(bal.toFixed(2))});
});
}

async function runBacktest(){
const btn=el('runBtn');
btn.disabled=true;
el('log').innerHTML='';
el('out').style.display='none';
const cap=parseFloat(el('cap').value)||100;
const contracts=parseInt(el('contracts').value)||10;
const fee=parseFloat(el('fee').value)||0.02;
const minEdge=parseFloat(el('minedge').value)||0.08;
const exitSnaps=parseInt(el('exitsnaps').value)||5;
const minMins=parseInt(el('minmins').value)||5;
const maxMins=parseInt(el('maxmins').value)||55;
const minObs=parseInt(el('minobs').value)||20;

try{
prog(5);
lg('Rebuilding index...','info');
const index=await rebuildIndex();
lg('Index: '+index.length+' snapshots','ok');

const toLoad=index.filter((_,i)=>i%2===0);
lg('Loading '+toLoad.length+' snapshots...','info');
const snaps=[];
for(let i=0;i<toLoad.length;i++){
const r=await proxy({_storage:true,action:'get',key:'ladder:'+toLoad[i]});
if(r.result){try{snaps.push(JSON.parse(r.result));}catch(e){}}
if(i%20===0)prog(5+Math.round(i/toLoad.length*55));
await new Promise(r=>setTimeout(r,15));
}
snaps.sort((a,b)=>new Date(a.ts)-new Date(b.ts));
lg('Loaded '+snaps.length+' snapshots','ok');
prog(62);
lg('Running calibrated models...','info');
lg('Min edge: $'+minEdge+' | Exit: '+exitSnaps*10+'sec | Min obs: '+minObs,'info');

// MODEL P: Fade Overpriced YES
// Market ask > fair value by minEdge → buy NO
const mPTrades=[];

// MODEL U: Buy Underpriced YES
// Market ask < fair value by minEdge → buy YES
const mUTrades=[];

// MODEL X: Near-Expiry ATM Fade
// Specific to the 5-min ATM overpricing we found (65.3% vs ~50% true prob)
// Only fires within 10 minutes of resolution on near-ATM contracts
const mXTrades=[];

const usedP=new Set();
const usedU=new Set();
const usedX=new Set();

for(let i=3;i<snaps.length-exitSnaps-1;i++){
const snap=snaps[i];
if(!snap.btc_spot)continue;
const btcSpot=snap.btc_spot;
const btcPrev3=snaps[i-3].btc_spot;
if(!btcPrev3)continue;
const btcDelta30s=btcSpot-btcPrev3;
if(Math.abs(btcDelta30s)>200)continue;

const exitSnap=snaps[i+exitSnaps];
if(!exitSnap)continue;

for(const evt of(snap.events||[])){
if(evt.series!=='KXBTCD')continue;
if(evt.mins_to_resolve<minMins||evt.mins_to_resolve>maxMins)continue;

const exitEvt=(exitSnap.events||[]).find(e=>e.ticker===evt.ticker);
if(!exitEvt)continue;

for(let si=0;si<evt.strikes.length;si++){
const st=evt.strikes[si];
if(!st||!st.t)continue;
const strikePrice=parseStrike(st.t);
if(!strikePrice)continue;

// Skip far OTM — no liquidity, no meaningful edge
if(Math.abs(strikePrice-btcSpot)>1200)continue;

const marketYesAsk=st.ya;
const marketNoAsk=st.na;
if(marketYesAsk<=0.01||marketYesAsk>=0.99)continue;
if(marketNoAsk<=0.01||marketNoAsk>=0.99)continue;

const dist=btcSpot-strikePrice;
const fvResult=getFairValue(dist,evt.mins_to_resolve,minObs);
if(!fvResult)continue;

const fv=fvResult.fv;
const yesEdge=fv-marketYesAsk; // positive = YES underpriced
const noEdge=(1-fv)-marketNoAsk; // positive = NO underpriced (YES overpriced)

const exitSt=exitEvt.strikes[si];
if(!exitSt)continue;

// MODEL P: Fade overpriced YES (buy NO)
if(noEdge>=minEdge&&marketNoAsk>=0.05&&marketNoAsk<=0.80){
const dedupKey='P:'+evt.ticker+':'+si+':'+snap.ts.slice(0,15);
if(!usedP.has(dedupKey)){
usedP.add(dedupKey);
const exitNoAsk=exitSt.na;
const pnl=(exitNoAsk-marketNoAsk-fee)*contracts;
mPTrades.push({model:'MP',ts:snap.ts,time:snap.ts.slice(11,19),ticker:evt.ticker,strikePrice,dist:dist.toFixed(0),side:'NO',entry:marketNoAsk.toFixed(3),exitPrice:exitNoAsk.toFixed(3),fv:fv.toFixed(3),edge:noEdge,pnl:parseFloat(pnl.toFixed(3)),mins:evt.mins_to_resolve,btcDelta:btcDelta30s.toFixed(0)});
}
}

// MODEL U: Buy underpriced YES
if(yesEdge>=minEdge&&marketYesAsk>=0.05&&marketYesAsk<=0.80){
const dedupKey='U:'+evt.ticker+':'+si+':'+snap.ts.slice(0,15);
if(!usedU.has(dedupKey)){
usedU.add(dedupKey);
const exitYesAsk=exitSt.ya;
const pnl=(exitYesAsk-marketYesAsk-fee)*contracts;
mUTrades.push({model:'MU',ts:snap.ts,time:snap.ts.slice(11,19),ticker:evt.ticker,strikePrice,dist:dist.toFixed(0),side:'YES',entry:marketYesAsk.toFixed(3),exitPrice:exitYesAsk.toFixed(3),fv:fv.toFixed(3),edge:yesEdge,pnl:parseFloat(pnl.toFixed(3)),mins:evt.mins_to_resolve,btcDelta:btcDelta30s.toFixed(0)});
}
}

// MODEL X: Near-expiry ATM overpricing (specific to calibration finding)
// ATM YES priced at 65% at 5 min, should be ~50% → buy NO
if(evt.mins_to_resolve<=10&&Math.abs(dist)<=50&&marketYesAsk>=0.55&&marketYesAsk<=0.80){
const atmNoEdge=marketYesAsk-0.52; // true ATM prob ~50-52%
if(atmNoEdge>=minEdge){
const dedupKey='X:'+evt.ticker+':'+si+':'+snap.ts.slice(0,15);
if(!usedX.has(dedupKey)){
usedX.add(dedupKey);
const exitYesAsk=exitSt.ya;
const exitNoAsk=exitSt.na;
const pnl=(exitNoAsk-marketNoAsk-fee)*contracts;
mXTrades.push({model:'MX',ts:snap.ts,time:snap.ts.slice(11,19),ticker:evt.ticker,strikePrice,dist:dist.toFixed(0),side:'NO',entry:marketNoAsk.toFixed(3),exitPrice:exitNoAsk.toFixed(3),fv:'0.520',edge:atmNoEdge,pnl:parseFloat(pnl.toFixed(3)),mins:evt.mins_to_resolve,btcDelta:btcDelta30s.toFixed(0)});
}
}
}
}
}
if(i%50===0)prog(62+Math.round(i/snaps.length*30));
}

prog(92);
lg('MP Fade Overpriced YES: '+mPTrades.length+' trades','ok');
lg('MU Buy Underpriced YES: '+mUTrades.length+' trades','ok');
lg('MX Near-Expiry ATM Fade: '+mXTrades.length+' trades','ok');

const ALL=[...mPTrades,...mUTrades,...mXTrades].sort((a,b)=>a.ts.localeCompare(b.ts));
lg('Total: '+ALL.length+' trades','ok');

const rP=calcStats(mPTrades,cap);
const rU=calcStats(mUTrades,cap);
const rX=calcStats(mXTrades,cap);
const rAll=calcStats(ALL,cap);

const ft=flatPnL(ALL,cap);
const ct=compPnL(ALL,cap,contracts);

prog(96);
render(ALL,mPTrades,mUTrades,mXTrades,ft,ct,rP,rU,rX,rAll,cap,contracts,fee);
prog(100);
el('out').style.display='block';

}catch(e){
lg('ERROR: '+e.message,'err');
console.error(e);
}
btn.disabled=false;
}

const MCOLORS={MP:'var(--coral)',MU:'var(--teal)',MX:'var(--amber)'};
const MSIGS={MP:'Fade Overpriced YES — buy NO when market overprices YES vs fair value',MU:'Buy Underpriced YES — buy YES when market underprices vs fair value',MX:'Near-Expiry ATM — fade 65% ATM pricing in final 10 min (true prob ~52%)'};

function render(ALL,mP,mU,mX,ft,ct,rP,rU,rX,rAll,cap,contracts,fee){
const sumPnl=t=>parseFloat(t.reduce((s,x)=>s+x.pnl,0).toFixed(2));
const tFlat=rAll?parseFloat(rAll.totalPnl):0;
const tDD=rAll?rAll.maxDD:'0';

el('sumGrid').innerHTML=
'<div class="stat"><div class="stat-val" style="color:var(--purple)">'+ALL.length+'</div><div class="stat-lbl">Total Trades</div></div>'+
'<div class="stat"><div class="stat-val '+(parseFloat(rAll?.wr||0)>=55?'green':'amber')+'">'+( rAll?rAll.wr:0)+'%</div><div class="stat-lbl">Combined WR</div></div>'+
'<div class="stat"><div class="stat-val '+(tFlat>=0?'green':'red')+'">'+fmtD(tFlat)+'</div><div class="stat-lbl">Total P&L</div></div>'+
'<div class="stat"><div class="stat-val '+(parseFloat(rAll?.perYear||0)>=7000?'green':parseFloat(rAll?.perYear||0)>=0?'amber':'red')+'">'+fmtD(parseFloat(rAll?.perYear||0))+'/yr</div><div class="stat-lbl">Ann. (extrapolated)</div></div>'+
'<div class="stat"><div class="stat-val amber">'+(rAll?rAll.avgEdge:'—')+'</div><div class="stat-lbl">Avg Edge Per Trade</div></div>';

const models=[{name:'MP',trades:mP,r:rP},{name:'MU',trades:mU,r:rU},{name:'MX',trades:mX,r:rX}];
el('modelCards').innerHTML=models.map(m=>{
if(!m.r)return'<div class="model-card" style="border-top:3px solid '+MCOLORS[m.name]+'"><div class="m-name" style="color:'+MCOLORS[m.name]+'">'+m.name+'</div><div class="m-wr" style="color:var(--muted)">0 trades</div><div class="m-ann">'+MSIGS[m.name]+'</div></div>';
const w=parseFloat(m.r.wr);
const p=sumPnl(m.trades);
return'<div class="model-card" style="border-top:3px solid '+MCOLORS[m.name]+'">'+'<div class="m-name" style="color:'+MCOLORS[m.name]+'">'+m.name+'</div>'+'<div class="m-wr '+(w>=60?'green':w>=50?'amber':'red')+'">'+w+'%WR</div>'+'<div class="m-pnl '+(p>=0?'green':'red')+'">'+fmtD(p)+' · '+m.trades.length+'t</div>'+'<div class="m-ann">Avg edge: '+(m.r?m.r.avgEdge:'—')+' | $/day: '+(m.r?'$'+m.r.perDay:'—')+'</div>'+'<div class="m-ann" style="margin-top:4px;font-size:9px">'+MSIGS[m.name]+'</div></div>';
}).join('');

const ff=ft.length?ft[ft.length-1].fb:cap;
const tFlatTotal=ff-cap;
el('flatBox').innerHTML=
'<div class="pnl-row"><span class="pnl-lbl">Starting Account</span><span class="pnl-val">$'+cap+'</span></div>'+
'<div class="pnl-row"><span class="pnl-lbl">Contracts/Trade</span><span class="pnl-val">'+contracts+'</span></div>'+
'<div class="pnl-row"><span class="pnl-lbl">Fee/Contract</span><span class="pnl-val">$'+fee+'</span></div>'+
'<div class="pnl-row"><span class="pnl-lbl">Final Balance</span><span class="pnl-val '+(tFlatTotal>=0?'green':'red')+'">$'+ff.toFixed(2)+'</span></div>'+
'<div class="pnl-row"><span class="pnl-lbl">Total P&L</span><span class="pnl-val '+(tFlatTotal>=0?'green':'red')+'">'+fmtD(tFlatTotal)+'</span></div>'+
'<div class="pnl-row"><span class="pnl-lbl">Return on $'+cap+'</span><span class="pnl-val">'+Math.round(tFlatTotal/cap*100)+'%</span></div>'+
'<div class="pnl-row"><span class="pnl-lbl">Max Drawdown</span><span class="pnl-val '+(parseFloat(tDD)>20?'red':'amber')+'">'+tDD+'%</span></div>'+
'<div class="pnl-row"><span class="pnl-lbl">Max Loss Streak</span><span class="pnl-val">'+(rAll?rAll.maxStreak:'—')+'</span></div>'+
'<div class="pnl-row"><span class="pnl-lbl">Est $/day</span><span class="pnl-val '+(parseFloat(rAll?.perDay||0)>=0?'green':'red')+'">'+(rAll?'$'+rAll.perDay:'—')+'</span></div>'+
'<div class="pnl-row"><span class="pnl-lbl">Est $/yr</span><span class="pnl-val '+(parseFloat(rAll?.perYear||0)>=0?'green':'red')+'">'+(rAll?fmtD(parseFloat(rAll.perYear))+'/yr':'—')+'</span></div>';

const cf=ct.length?ct[ct.length-1].cb:cap;
const tCompTotal=cf-cap;
el('compBox').innerHTML=
'<div class="pnl-row"><span class="pnl-lbl">Starting Account</span><span class="pnl-val">$'+cap+'</span></div>'+
'<div class="pnl-row"><span class="pnl-lbl">Final Balance</span><span class="pnl-val '+(tCompTotal>=0?'green':'red')+'">$'+cf.toFixed(2)+'</span></div>'+
'<div class="pnl-row"><span class="pnl-lbl">Total P&L</span><span class="pnl-val '+(tCompTotal>=0?'green':'red')+'">'+fmtD(tCompTotal)+'</span></div>'+
'<div class="pnl-row"><span class="pnl-lbl">Return</span><span class="pnl-val">'+Math.round(tCompTotal/cap*100)+'%</span></div>'+
'<div class="pnl-row" style="border-top:1px solid var(--border);padding-top:8px"><span class="pnl-lbl amber" style="font-size:10px">⚠ Compound is theoretical ceiling</span></div>';

const byHour={};
ft.forEach(t=>{const h=t.ts.slice(11,13)+'h';if(!byHour[h])byHour[h]={trades:[],pnl:0,edges:[],models:new Set()};byHour[h].trades.push(t);byHour[h].pnl+=t.pnl;if(t.edge)byHour[h].edges.push(t.edge);byHour[h].models.add(t.model);});
let rb=cap,hrows='';
for(const h of Object.keys(byHour).sort()){
const hd=byHour[h];
const hw=hd.trades.filter(t=>t.pnl>0).length;
const hwr=Math.round(hw/hd.trades.length*100);
const avgEdge=hd.edges.length?(hd.edges.reduce((s,e)=>s+e,0)/hd.edges.length).toFixed(3):'—';
rb+=hd.pnl;
hrows+='<tr><td>'+h+' UTC</td><td>'+hd.trades.length+'</td><td class="'+(hwr>=55?'green':'amber')+'">'+hwr+'%</td><td class="'+(hd.pnl>=0?'green':'red')+'">'+fmtD(hd.pnl)+'</td><td>$'+rb.toFixed(2)+'</td><td class="amber">'+avgEdge+'</td><td style="color:var(--muted);font-size:10px">[...'+hd.models.size+' models]</td></tr>';
}
el('hourTbl').innerHTML=hrows||'<tr><td colspan="7" style="color:var(--muted)">No trades</td></tr>';

el('tabs').innerHTML=
'<span class="tab active" onclick="showTab(\'all\',this)">All ('+ALL.length+')</span>'+
['MP','MU','MX'].map(n=>'<span class="tab" onclick="showTab(\''+n+'\',this)" style="border-color:'+MCOLORS[n]+'">'+n+' ('+ALL.filter(t=>t.model===n).length+')</span>').join('');

window._ft=ft;
showTab('all');

lg('══════ CALIBRATED RESULTS ══════','ok');
models.forEach(m=>{if(m.r)lg('  '+m.name+': '+m.trades.length+'t | '+m.r.wr+'%WR | '+fmtD(sumPnl(m.trades))+' | avg edge: '+m.r.avgEdge+' | $/day: $'+m.r.perDay,parseFloat(m.r.wr)>=55?'ok':'warn');else lg('  '+m.name+': 0 trades','warn');});
lg('COMBINED: '+ALL.length+'t | '+(rAll?rAll.wr:0)+'%WR | '+fmtD(tFlat)+' | '+(rAll?'$'+rAll.perDay+'/day | $'+rAll.perYear+'/yr':''),'ok');
}

function showTab(tab,e2){
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
if(e2)e2.classList.add('active');
const ft=window._ft||[];
const filtered=tab==='all'?ft:ft.filter(t=>t.model===tab);
const MCOLORS={MP:'var(--coral)',MU:'var(--teal)',MX:'var(--amber)'};
const head='<div class="trow head"><span>Time</span><span>Model</span><span>Side</span><span>Strike $</span><span>Entry</span><span>Exit</span><span>FV</span><span>Edge</span><span>P&L / Bal</span></div>';
const rows=filtered.slice(0,300).map(t=>{
const w=t.pnl>0;
return'<div class="trow '+(w?'win':'loss')+'">'+'<span>'+t.time+'</span>'+'<span style="color:'+(MCOLORS[t.model]||'var(--muted)')+'">'+t.model+'</span>'+'<span style="color:'+(t.side==='YES'?'var(--teal)':'var(--coral)')+'">'+t.side+'</span>'+'<span class="amber">$'+Math.round(t.strikePrice||0)+'</span>'+'<span>'+t.entry+'</span>'+'<span>'+t.exitPrice+'</span>'+'<span style="color:var(--muted)">'+t.fv+'</span>'+'<span class="amber">'+(typeof t.edge==='number'?t.edge.toFixed(3):t.edge)+'</span>'+'<span class="'+(w?'green':'red')+'">'+fmtD(t.pnl)+' $'+t.fb+'</span>'+'</div>';
}).join('');
const more=filtered.length>300?'<div style="text-align:center;padding:10px;color:var(--purple);font-family:\'Courier New\',monospace;font-size:11px">...'+(filtered.length-300)+' more</div>':'';
el('tlog').innerHTML=head+rows+more;
}
</script>
</body>
</html>
