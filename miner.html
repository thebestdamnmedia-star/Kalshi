<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalshi Brute Force Miner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a14;color:#eee;font-family:ui-monospace,monospace;padding:14px;font-size:12px;line-height:1.5;max-width:900px;margin:0 auto}
h1{font-size:18px;color:#f7931a;margin-bottom:14px}
.btn{background:#f7931a;color:#000;border:none;padding:11px 20px;border-radius:6px;font-weight:600;font-size:13px;cursor:pointer;width:100%;margin-bottom:10px}
.card{background:#16162a;border:1px solid #2a2a40;border-radius:8px;padding:12px;margin-bottom:10px}
.sec{font-size:10px;color:#888;text-transform:uppercase;margin-bottom:8px;border-bottom:1px solid #2a2a40;padding-bottom:5px}
.row{display:flex;justify-content:space-between;padding:3px 0}
.label{color:#888}
.val{font-weight:600}
.amber{color:#ffb340}
.green{color:#00e5aa}
.red{color:#ff5f6d}
.muted{color:#555}
.tbl{width:100%;border-collapse:collapse;font-size:10px;margin-top:6px}
.tbl th{text-align:left;padding:4px 6px;background:#0d0d18;color:#888;font-size:9px}
.tbl td{padding:4px 6px;border-bottom:1px solid #1a1a28}
.progress{background:#0d0d18;border-radius:4px;height:8px;margin:8px 0}
.progress-bar{background:#f7931a;height:8px;border-radius:4px;transition:width 0.3s}
</style>
</head>
<body>
<h1>Kalshi Brute Force Miner</h1>

<div class="card">
<div class="sec">Settings</div>
<div class="row"><span class="label">Min contract move to flag:</span><span class="val amber">$0.10</span></div>
<div class="row"><span class="label">Lookback window:</span><span class="val amber">3 snapshots (~30 sec)</span></div>
<div class="row"><span class="label">Forward window:</span><span class="val amber">5 snapshots (~50 sec)</span></div>
<div class="row"><span class="label">Min BTC move to count:</span><span class="val amber">$5</span></div>
</div>

<div class="card">
<div class="sec">Progress</div>
<div class="row"><span class="label">Status:</span><span class="val" id="status">Idle</span></div>
<div class="row"><span class="label">Snapshots loaded:</span><span class="val" id="loaded">0</span></div>
<div class="progress"><div class="progress-bar" id="bar" style="width:0%"></div></div>
</div>

<button class="btn" onclick="mine()">Run Brute Force Mine</button>

<div id="results"></div>

<script>
async function proxy(body) {
  const r = await fetch(`/api/proxy`, {
    method: `POST`,
    headers: {[`Content-Type`]: `application/json`},
    body: JSON.stringify(body)
  });
  return r.json();
}

function setStatus(msg) { document.getElementById(`status`).textContent = msg; }
function setProgress(n, total) {
  document.getElementById(`loaded`).textContent = n + ` / ` + total;
  document.getElementById(`bar`).style.width = Math.round(n/total*100) + `%`;
}

async function loadAll() {
  setStatus(`Loading index...`);
  const d = await proxy({_storage: true, action: `get`, key: `ladder:index`});
  const index = d.result ? JSON.parse(d.result) : [];
  if (!index.length) { setStatus(`No data`); return []; }

  // Sample every 2nd snapshot to keep load manageable
  const toLoad = index.filter((_, i) => i % 2 === 0);
  setStatus(`Loading ${toLoad.length} snapshots...`);

  const snaps = [];
  for (let i = 0; i < toLoad.length; i++) {
    const r = await proxy({_storage: true, action: `get`, key: `ladder:` + toLoad[i]});
    if (r.result) {
      try { snaps.push(JSON.parse(r.result)); } catch {}
    }
    if (i % 20 === 0) setProgress(i, toLoad.length);
    await new Promise(r => setTimeout(r, 15));
  }
  setProgress(toLoad.length, toLoad.length);
  snaps.sort((a, b) => new Date(a.ts) - new Date(b.ts));
  return snaps;
}

async function mine() {
  document.getElementById(`results`).innerHTML = ``;
  const snaps = await loadAll();
  if (!snaps.length) return;

  setStatus(`Brute forcing ${snaps.length} snapshots...`);

  // For each snapshot at position i, look at each strike
  // Check what price that strike is at i+1, i+2, i+3, i+4, i+5
  // If it moved +10c or more -> WIN event
  // If it moved -10c or more -> LOSS event
  // For each WIN/LOSS, record what BTC was doing at i-3, i-2, i-1, i

  const wins = []; // contract moved up 10c+
  const losses = []; // contract moved down 10c+
  const btcBuckets = {}; // btc_delta_bucket -> {wins, total}

  for (let i = 3; i < snaps.length - 5; i++) {
    const snap = snaps[i];
    if (!snap.btc_spot) continue;

    // BTC context: what did BTC do in the 3 snapshots before this one
    const btc3 = snaps[i-3].btc_spot;
    const btc2 = snaps[i-2].btc_spot;
    const btc1 = snaps[i-1].btc_spot;
    const btcNow = snap.btc_spot;
    if (!btc3 || !btc2 || !btc1) continue;

    const btcDelta30s = btcNow - btc3; // BTC move over last 30 sec
    const btcDelta10s = btcNow - btc1; // BTC move over last 10 sec

    // Bucket btcDelta30s into $20 buckets
    const bucket = Math.floor(btcDelta30s / 20) * 20;

    for (const evt of (snap.events || [])) {
      if (evt.series !== `KXBTCD`) continue; // focus on hourly contracts
      if (evt.mins_to_resolve < 5) continue; // skip near-expiry

      for (const st of evt.strikes) {
        const askNow = st.ya;
        if (askNow < 0.05 || askNow > 0.95) continue; // skip near-certain
        if (!st.s) continue;

        // Find this same strike in i+5 snapshot
        const futureSnap = snaps[i + 5];
        if (!futureSnap) continue;
        const futureEvt = (futureSnap.events || []).find(e => e.ticker === evt.ticker);
        if (!futureEvt) continue;
        const futureSt = futureEvt.strikes.find(s => s.s === st.s);
        if (!futureSt) continue;

        const askFuture = futureSt.ya;
        const contractMove = askFuture - askNow;

        // Track in bucket
        if (!btcBuckets[bucket]) btcBuckets[bucket] = {wins: 0, losses: 0, flat: 0, total: 0, totalMove: 0};
        btcBuckets[bucket].total++;
        btcBuckets[bucket].totalMove += contractMove;

        if (contractMove >= 0.10) {
          btcBuckets[bucket].wins++;
          wins.push({
            ts: snap.ts.slice(11, 19),
            strike: st.s,
            ticker: evt.ticker,
            askBefore: askNow.toFixed(2),
            askAfter: askFuture.toFixed(2),
            move: contractMove.toFixed(2),
            btcDelta30s: btcDelta30s.toFixed(0),
            btcDelta10s: btcDelta10s.toFixed(0),
            btcNow: btcNow,
            mins: evt.mins_to_resolve
          });
        } else if (contractMove <= -0.10) {
          btcBuckets[bucket].losses++;
          losses.push({
            ts: snap.ts.slice(11, 19),
            strike: st.s,
            ticker: evt.ticker,
            askBefore: askNow.toFixed(2),
            askAfter: askFuture.toFixed(2),
            move: contractMove.toFixed(2),
            btcDelta30s: btcDelta30s.toFixed(0),
            btcDelta10s: btcDelta10s.toFixed(0),
            btcNow: btcNow,
            mins: evt.mins_to_resolve
          });
        } else {
          btcBuckets[bucket].flat++;
        }
      }
    }

    if (i % 50 === 0) setProgress(i, snaps.length);
  }

  setStatus(`Done. ${wins.length} win events, ${losses.length} loss events found.`);

  let html = ``;

  // SUMMARY CARD
  html += `<div class="card">`;
  html += `<div class="sec">Summary</div>`;
  html += `<div class="row"><span class="label">Snapshots analyzed:</span><span class="val">${snaps.length}</span></div>`;
  html += `<div class="row"><span class="label">Contract +10c moves found:</span><span class="val green">${wins.length}</span></div>`;
  html += `<div class="row"><span class="label">Contract -10c moves found:</span><span class="val red">${losses.length}</span></div>`;
  const totalEvents = wins.length + losses.length;
  html += `<div class="row"><span class="label">Total significant moves:</span><span class="val amber">${totalEvents}</span></div>`;
  html += `</div>`;

  // BTC BUCKET TABLE — the key insight
  html += `<div class="card">`;
  html += `<div class="sec">BTC 30s Move → Contract Move Frequency</div>`;
  html += `<div class="muted" style="padding:4px 0 8px">When BTC moved X over 30 sec, how often did contracts move 10c+?</div>`;
  html += `<table class="tbl"><thead><tr><th>BTC 30s Δ</th><th>+10c moves</th><th>-10c moves</th><th>Flat</th><th>Total</th><th>Up %</th><th>Down %</th><th>Avg ct move</th></tr></thead><tbody>`;

  const sortedBuckets = Object.keys(btcBuckets).map(Number).sort((a,b) => a - b);
  for (const b of sortedBuckets) {
    const bk = btcBuckets[b];
    const upPct = (bk.wins / bk.total * 100).toFixed(1);
    const downPct = (bk.losses / bk.total * 100).toFixed(1);
    const avgMove = (bk.totalMove / bk.total).toFixed(3);
    const label = b >= 0 ? `+$${b} to +$${b+20}` : `$${b} to $${b+20}`;
    const upCls = parseFloat(upPct) > 5 ? `green` : `muted`;
    const downCls = parseFloat(downPct) > 5 ? `red` : `muted`;
    html += `<tr><td class="amber">${label}</td><td class="${upCls}">${bk.wins}</td><td class="${downCls}">${bk.losses}</td><td class="muted">${bk.flat}</td><td>${bk.total}</td><td class="${upCls}">${upPct}%</td><td class="${downCls}">${downPct}%</td><td>${avgMove}</td></tr>`;
  }
  html += `</tbody></table></div>`;

  // TOP WIN SETUPS
  if (wins.length) {
    html += `<div class="card">`;
    html += `<div class="sec">Top +10c Move Examples (first 30)</div>`;
    html += `<table class="tbl"><thead><tr><th>Time</th><th>Strike</th><th>Before</th><th>After</th><th>Move</th><th>BTC 30s</th><th>BTC 10s</th><th>Mins</th></tr></thead><tbody>`;
    const topWins = wins.sort((a,b) => parseFloat(b.move) - parseFloat(a.move)).slice(0, 30);
    for (const w of topWins) {
      html += `<tr><td>${w.ts}</td><td>$${w.strike}</td><td>${w.askBefore}</td><td class="green">${w.askAfter}</td><td class="green">+${w.move}</td><td class="${parseFloat(w.btcDelta30s)>=0?`green`:`red`}">${w.btcDelta30s}</td><td class="${parseFloat(w.btcDelta10s)>=0?`green`:`red`}">${w.btcDelta10s}</td><td>${w.mins}</td></tr>`;
    }
    html += `</tbody></table></div>`;
  }

  // TOP LOSS SETUPS
  if (losses.length) {
    html += `<div class="card">`;
    html += `<div class="sec">Top -10c Move Examples (first 30)</div>`;
    html += `<table class="tbl"><thead><tr><th>Time</th><th>Strike</th><th>Before</th><th>After</th><th>Move</th><th>BTC 30s</th><th>BTC 10s</th><th>Mins</th></tr></thead><tbody>`;
    const topLosses = losses.sort((a,b) => parseFloat(a.move) - parseFloat(b.move)).slice(0, 30);
    for (const l of topLosses) {
      html += `<tr><td>${l.ts}</td><td>$${l.strike}</td><td>${l.askBefore}</td><td class="red">${l.askAfter}</td><td class="red">${l.move}</td><td class="${parseFloat(l.btcDelta30s)>=0?`green`:`red`}">${l.btcDelta30s}</td><td class="${parseFloat(l.btcDelta10s)>=0?`green`:`red`}">${l.btcDelta10s}</td><td>${l.mins}</td></tr>`;
    }
    html += `</tbody></table></div>`;
  }

  document.getElementById(`results`).innerHTML = html;
}
</script>
</body>
</html>
