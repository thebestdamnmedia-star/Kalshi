<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kalshi — 3-Model Backtest</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--surface:#111118;--surface2:#18181f;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--purple:#7c6ff7;--teal:#2dd4a0;--coral:#f87171;--amber:#fbbf24;--blue:#60a5fa;--green:#4ade80;--text:#e8e8f0;--muted:#6b6b80}
body{background:var(--bg);color:var(--text);font-family:'Helvetica Neue',sans-serif;font-size:14px;padding:24px;max-width:1100px;margin:0 auto}
h1{font-size:20px;font-weight:500;margin-bottom:4px}
.sub{font-size:11px;color:var(--muted);font-family:'Courier New',monospace;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:14px}
.sec{font-size:10px;color:var(--muted);font-family:'Courier New',monospace;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.btn{padding:12px 24px;border-radius:6px;border:none;font-size:14px;font-weight:500;cursor:pointer;width:100%;margin-top:6px}
.btn-run{background:var(--amber);color:#000}
.btn-run:disabled{opacity:.4;cursor:not-allowed}
.prog-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:8px}
.prog-fill{height:100%;background:var(--amber);border-radius:2px;transition:width .3s;width:0}
#log{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;font-family:'Courier New',monospace;font-size:11px;color:var(--muted);min-height:60px;max-height:160px;overflow-y:auto;white-space:pre-wrap;margin-top:10px}
.ok{color:var(--teal)}.warn{color:var(--amber)}.err{color:var(--coral)}.info{color:var(--purple)}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.stat{background:var(--surface2);border-radius:8px;padding:14px;text-align:center}
.stat-val{font-size:22px;font-weight:600}
.stat-lbl{font-size:10px;color:var(--muted);font-family:'Courier New',monospace;margin-top:3px}
.model-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px}
.m-name{font-size:9px;font-family:'Courier New',monospace;font-weight:700;margin-bottom:4px}
.m-wr{font-size:18px;font-weight:600;margin-bottom:2px}
.m-pnl{font-size:11px;margin-bottom:2px}
.m-ann{font-size:10px;color:var(--muted);font-family:'Courier New',monospace}
.pnl-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px}
.pnl-title{font-size:10px;color:var(--muted);font-family:'Courier New',monospace;margin-bottom:12px}
.pnl-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.pnl-row:last-child{border-bottom:none}
.pnl-lbl{color:var(--muted);font-size:11px;font-family:'Courier New',monospace}
.pnl-val{font-weight:600}
table{width:100%;border-collapse:collapse;font-family:'Courier New',monospace;font-size:11px}
th{text-align:left;padding:6px 8px;background:var(--surface2);color:var(--muted);font-weight:500;border-bottom:1px solid var(--border)}
td{padding:5px 8px;border-bottom:1px solid var(--border)}
.green{color:var(--teal)}.red{color:var(--coral)}.amber{color:var(--amber)}.blue{color:var(--blue)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{padding:5px 12px;border-radius:20px;font-size:10px;font-family:'Courier New',monospace;cursor:pointer;border:1px solid var(--border);color:var(--muted)}
.tab.active{color:var(--text);background:rgba(255,255,255,.08);border-color:var(--border2)}
.trow{display:grid;grid-template-columns:80px 60px 55px 65px 65px 70px 80px;gap:4px;padding:4px 6px;border-radius:4px;font-family:'Courier New',monospace;font-size:10px;border-bottom:1px solid var(--border)}
.trow.win{background:rgba(45,212,160,.04)}.trow.loss{background:rgba(248,113,113,.04)}.trow.head{color:var(--muted);font-size:9px}
.cfg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
label{font-size:11px;color:var(--muted);font-family:'Courier New',monospace;display:block;margin-bottom:4px}
input[type=number]{background:var(--bg);border:1px solid var(--border2);border-radius:5px;padding:6px 8px;color:var(--text);font-family:'Courier New',monospace;font-size:11px;width:100%}
</style>
</head>
<body>
<h1>Kalshi — 3-Model Backtest</h1>
<div class="sub">M1 Large Order Fade · M2 BTC Momentum · M3 Stagnation Fade · KXBTCD hourly contracts</div>

<div class="card">
<div class="sec">Configuration</div>
<div class="cfg">
<div><label>Starting Account</label><input type="number" id="cap" value="100" step="50"></div>
<div><label>Contracts Per Trade</label><input type="number" id="contracts" value="10" step="5"></div>
<div><label>Fee Per Contract ($)</label><input type="number" id="fee" value="0.02" step="0.01"></div>
</div>
<button class="btn btn-run" id="runBtn" onclick="runBacktest()">Run 3-Model Backtest</button>
<div class="prog-bar"><div class="prog-fill" id="pf"></div></div>
<div id="log"></div>
</div>

<div id="out" style="display:none">
<div class="g5" id="sumGrid"></div>
<div class="g3" id="modelCards"></div>
<div class="g2">
<div class="pnl-box"><div class="pnl-title">FLAT P&L — fixed contracts per trade</div><div id="flatBox"></div></div>
<div class="pnl-box"><div class="pnl-title">COMPOUND — reinvest profits</div><div id="compBox"></div></div>
</div>
<div class="card">
<div class="sec">Monthly Breakdown</div>
<table><thead><tr><th>Hour Block</th><th>Trades</th><th>WR</th><th>P&L</th><th>Running Bal</th><th>Models Active</th></tr></thead>
<tbody id="monthTbl"></tbody></table>
</div>
<div class="card">
<div class="sec">Trade Log</div>
<div class="tabs" id="tabs"></div>
<div id="tlog"></div>
</div>
</div>

<script>
const el=id=>document.getElementById(id);
function lg(msg,cls='info'){const d=el('log');d.innerHTML+='<span class="'+cls+'">'+msg+'</span>\n';d.scrollTop=d.scrollHeight;}
function prog(p){el('pf').style.width=p+'%';}
function fmtD(n){return(n>=0?'+$':'-$')+Math.abs(n).toFixed(2);}

async function proxy(body){
const r=await fetch('/api/proxy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
return r.json();
}

async function rebuildIndex(){
lg('Rebuilding index...','info');
const result=await proxy({_storage:true,action:'list',key:'ladder:*'});
let keys=result.result;
if(!keys||!Array.isArray(keys))return [];
const snapKeys=keys.filter(k=>k!=='ladder:index'&&k!=='ladder:latest');
const timestamps=snapKeys.map(k=>k.replace('ladder:','')).sort();
await proxy({_storage:true,action:'set',key:'ladder:index',value:timestamps});
lg('Index rebuilt — '+timestamps.length+' snapshots','ok');
return timestamps;
}

async function loadSnaps(index){
const toLoad=index.filter((_,i)=>i%2===0);
lg('Loading '+toLoad.length+' snapshots...','info');
const snaps=[];
for(let i=0;i<toLoad.length;i++){
const r=await proxy({_storage:true,action:'get',key:'ladder:'+toLoad[i]});
if(r.result){try{snaps.push(JSON.parse(r.result));}catch(e){}}
if(i%20===0)prog(10+Math.round(i/toLoad.length*50));
await new Promise(r=>setTimeout(r,15));
}
snaps.sort((a,b)=>new Date(a.ts)-new Date(b.ts));
lg('Loaded '+snaps.length+' snapshots','ok');
return snaps;
}

function parseStrike(ticker){
const m=ticker.match(/-T(\d+(?:\.\d+)?)$/);
return m?parseFloat(m[1]):null;
}

function findATMStrikes(strikes,btcSpot,window){
// Find strikes within $window of BTC spot
return strikes.map((st,idx)=>{
const price=parseStrike(st.t);
return{st,idx,price,dist:price?Math.abs(price-btcSpot):999999};
}).filter(s=>s.price&&s.dist<=window).sort((a,b)=>a.dist-b.dist);
}

function calcStats(trades,cap,contracts,fee){
if(!trades.length)return null;
const wins=trades.filter(t=>t.pnl>0);
const losses=trades.filter(t=>t.pnl<=0);
const totalPnl=trades.reduce((s,t)=>s+t.pnl,0);
const avgWin=wins.length?wins.reduce((s,t)=>s+t.pnl,0)/wins.length:0;
const avgLoss=losses.length?losses.reduce((s,t)=>s+t.pnl,0)/losses.length:0;
let peak=cap,bal=cap,maxDD=0;
for(const t of trades){bal+=t.pnl;if(bal>peak)peak=bal;const dd=(peak-bal)/peak*100;if(dd>maxDD)maxDD=dd;}
let maxStreak=0,streak=0;
for(const t of trades){if(t.pnl<=0){streak++;if(streak>maxStreak)maxStreak=streak;}else streak=0;}
const hours=(new Date(trades[trades.length-1].ts)-new Date(trades[0].ts))/(1000*3600)||1;
const perHour=totalPnl/hours;
const perDay=perHour*6.5;
const perYear=perDay*252;
return{count:trades.length,wins:wins.length,losses:losses.length,wr:(wins.length/trades.length*100).toFixed(1),totalPnl:totalPnl.toFixed(2),avgWin:avgWin.toFixed(3),avgLoss:avgLoss.toFixed(3),finalBal:(cap+totalPnl).toFixed(2),maxDD:maxDD.toFixed(1),maxStreak,perDay:perDay.toFixed(2),perYear:perYear.toFixed(0)};
}

function flatPnL(trades,cap){
let bal=cap;
return trades.map(t=>{bal+=t.pnl;return Object.assign({},t,{fb:parseFloat(bal.toFixed(2))});});
}

function compPnL(trades,cap,contracts,fee){
let bal=cap;
return trades.map(t=>{
const scale=Math.max(1,Math.floor(bal/cap)*contracts);
const scaledPnl=t.pnl*(scale/contracts);
bal+=scaledPnl;
return Object.assign({},t,{cp:parseFloat(scaledPnl.toFixed(2)),cb:parseFloat(bal.toFixed(2))});
});
}

async function runBacktest(){
const btn=el('runBtn');
btn.disabled=true;
el('log').innerHTML='';
el('out').style.display='none';
const cap=parseFloat(el('cap').value)||100;
const contracts=parseInt(el('contracts').value)||10;
const fee=parseFloat(el('fee').value)||0.02;

try{
prog(5);
const index=await rebuildIndex();
if(!index.length){lg('No data found','err');btn.disabled=false;return;}
prog(10);
const snaps=await loadSnaps(index);
if(snaps.length<10){lg('Not enough snapshots','err');btn.disabled=false;return;}
prog(60);
lg('Running 3 models...','info');

const m1trades=[];
const m2trades=[];
const m3trades=[];
let flatStreak=0;
const usedM1=new Set();
const usedM2=new Set();
const usedM3=new Set();

for(let i=5;i<snaps.length-13;i++){
const snap=snaps[i];
if(!snap.btc_spot)continue;
const btc5=snaps[i-5].btc_spot;
const btc3=snaps[i-3].btc_spot;
const btc1=snaps[i-1].btc_spot;
const btcNow=snap.btc_spot;
if(!btc5||!btc3||!btc1)continue;
const btcDelta30s=btcNow-btc3;
const btcDelta10s=btcNow-btc1;
const btcDelta50s=btcNow-btc5;
if(Math.abs(btcDelta30s)>200)continue;
if(Math.abs(btcDelta10s)>200)continue;
const btcFlat=Math.abs(btcDelta30s)<10;
const btcFlat50s=Math.abs(btcDelta50s)<5;
if(btcFlat50s)flatStreak++;
else flatStreak=0;

for(const evt of(snap.events||[])){
if(evt.series!=='KXBTCD')continue;
if(evt.mins_to_resolve<=3)continue;
const exit6snap=snaps[i+6];
const exit5snap=snaps[i+5];
if(!exit6snap||!exit5snap)continue;
const exit6evt=(exit6snap.events||[]).find(e=>e.ticker===evt.ticker);
const exit5evt=(exit5snap.events||[]).find(e=>e.ticker===evt.ticker);
if(!exit6evt||!exit5evt)continue;

// MODEL 1: Large Order Fade
// Detect: contract moved 20c+ in last 5 snaps on flat BTC, 15+ mins left
// Trade: buy NO (fade the spike)
// Exit: T+60 sec (6 snaps)
const prev5snap=snaps[i-5];
if(prev5snap&&btcFlat&&evt.mins_to_resolve>=15){
const prev5evt=(prev5snap.events||[]).find(e=>e.ticker===evt.ticker);
if(prev5evt){
const atmStrikes=findATMStrikes(evt.strikes,btcNow,500);
for(const{st,idx}of atmStrikes.slice(0,5)){
const prevSt=prev5evt.strikes[idx];
if(!prevSt)continue;
const recentMove=st.ya-prevSt.ya;
if(recentMove>=0.20&&st.na>=0.05&&st.na<=0.80){
const dedupKey='m1:'+evt.ticker+':'+idx+':'+snap.ts.slice(0,16);
if(usedM1.has(dedupKey))continue;
usedM1.add(dedupKey);
const exitSt=exit6evt.strikes[idx];
if(!exitSt)continue;
const yesDrop=st.ya-exitSt.ya;
const pnl=(yesDrop-fee)*contracts;
m1trades.push({model:'M1',ts:snap.ts,time:snap.ts.slice(11,19),ticker:evt.ticker,entry:st.na.toFixed(2),exitPrice:exitSt.na.toFixed(2),pnl:parseFloat(pnl.toFixed(3)),btcDelta:btcDelta30s.toFixed(0),mins:evt.mins_to_resolve,signal:'Large order fade'});
break;
}
}
}
}

// MODEL 2: BTC Momentum Follow
// Detect: BTC moves $60+ in 30 sec
// Trade: buy YES on ATM strikes in direction of move
// Exit: T+50 sec (5 snaps)
if(Math.abs(btcDelta30s)>=60&&evt.mins_to_resolve>=10){
const atmStrikes=findATMStrikes(evt.strikes,btcNow,300);
for(const{st,idx}of atmStrikes.slice(0,3)){
if(st.ya<0.10||st.ya>0.70)continue;
const dedupKey='m2:'+evt.ticker+':'+idx+':'+snap.ts.slice(0,16);
if(usedM2.has(dedupKey))continue;
usedM2.add(dedupKey);
const exitSt=exit5evt.strikes[idx];
if(!exitSt)continue;
const priceMove=exitSt.ya-st.ya;
const pnl=(priceMove-fee)*contracts;
m2trades.push({model:'M2',ts:snap.ts,time:snap.ts.slice(11,19),ticker:evt.ticker,entry:st.ya.toFixed(2),exitPrice:exitSt.ya.toFixed(2),pnl:parseFloat(pnl.toFixed(3)),btcDelta:btcDelta30s.toFixed(0),mins:evt.mins_to_resolve,signal:'BTC momentum +$'+(Math.abs(btcDelta30s).toFixed(0))});
break;
}
}

// MODEL 3: Stagnation Fade
// Detect: BTC flat for 5+ consecutive snaps (50 sec)
// Trade: buy NO on OTM YES contracts priced $0.20-0.50
// Exit: T+60 sec (6 snaps)
if(flatStreak>=5&&evt.mins_to_resolve>=15){
const atmStrikes=findATMStrikes(evt.strikes,btcNow,600);
for(const{st,idx}of atmStrikes){
if(st.ya<0.20||st.ya>0.50)continue;
if(st.na<0.50||st.na>0.80)continue;
const dedupKey='m3:'+evt.ticker+':'+idx+':'+snap.ts.slice(0,16);
if(usedM3.has(dedupKey))continue;
usedM3.add(dedupKey);
const exitSt=exit6evt.strikes[idx];
if(!exitSt)continue;
const yesDrop=st.ya-exitSt.ya;
const pnl=(yesDrop-fee)*contracts;
m3trades.push({model:'M3',ts:snap.ts,time:snap.ts.slice(11,19),ticker:evt.ticker,entry:st.na.toFixed(2),exitPrice:exitSt.na.toFixed(2),pnl:parseFloat(pnl.toFixed(3)),btcDelta:btcDelta30s.toFixed(0),mins:evt.mins_to_resolve,signal:'Stagnation fade streak:'+flatStreak});
break;
}
}
}
if(i%50===0)prog(60+Math.round(i/snaps.length*30));
}

prog(90);
lg('M1 Large Order Fade: '+m1trades.length+' trades','ok');
lg('M2 BTC Momentum: '+m2trades.length+' trades','ok');
lg('M3 Stagnation Fade: '+m3trades.length+' trades','ok');

const ALL=[...m1trades,...m2trades,...m3trades].sort((a,b)=>a.ts.localeCompare(b.ts));
lg('Total: '+ALL.length+' trades','ok');

const r1=calcStats(m1trades,cap,contracts,fee);
const r2=calcStats(m2trades,cap,contracts,fee);
const r3=calcStats(m3trades,cap,contracts,fee);
const rAll=calcStats(ALL,cap,contracts,fee);

const ft=flatPnL(ALL,cap);
const ct=compPnL(ALL,cap,contracts,fee);

prog(95);
render(ALL,m1trades,m2trades,m3trades,ft,ct,r1,r2,r3,rAll,cap,contracts,fee,snaps.length);
prog(100);
el('out').style.display='block';
}catch(e){
lg('ERROR: '+e.message,'err');
}
btn.disabled=false;
}

const MCOLORS={M1:'var(--coral)',M2:'var(--teal)',M3:'var(--blue)'};
const MSIGS={M1:'Large Order Fade — buy NO after 20c+ spike on flat BTC',M2:'BTC Momentum — buy YES after $60+ BTC move',M3:'Stagnation Fade — buy NO on OTM YES when BTC flat 50sec+'};

function render(ALL,m1,m2,m3,ft,ct,r1,r2,r3,rAll,cap,contracts,fee,snapCount){
const wr=t=>t.length?Math.round(t.filter(x=>x.pnl>0).length/t.length*100):0;
const sumPnl=t=>t.reduce((s,x)=>s+x.pnl,0);

// SUMMARY STATS
const tWR=rAll?rAll.wr:0;
const tFlat=rAll?parseFloat(rAll.totalPnl):0;
const tFinal=rAll?parseFloat(rAll.finalBal):cap;
const tDD=rAll?rAll.maxDD:0;
el('sumGrid').innerHTML=
'<div class="stat"><div class="stat-val" style="color:var(--purple)">'+ALL.length+'</div><div class="stat-lbl">Total Trades</div></div>'+
'<div class="stat"><div class="stat-val '+(parseFloat(tWR)>=55?'green':'amber')+'">'+tWR+'%</div><div class="stat-lbl">Combined WR</div></div>'+
'<div class="stat"><div class="stat-val '+(tFlat>=0?'green':'red')+'">'+fmtD(tFlat)+'</div><div class="stat-lbl">Total P&L</div></div>'+
'<div class="stat"><div class="stat-val '+(parseFloat(rAll?.perYear||0)>=7000?'green':parseFloat(rAll?.perYear||0)>=0?'amber':'red')+'">'+fmtD(parseFloat(rAll?.perYear||0))+'/yr</div><div class="stat-lbl">Ann. (extrapolated)</div></div>'+
'<div class="stat"><div class="stat-val amber">'+snapCount+'</div><div class="stat-lbl">Snapshots Analyzed</div></div>';

// MODEL CARDS
const models=[{name:'M1',trades:m1,r:r1},{name:'M2',trades:m2,r:r2},{name:'M3',trades:m3,r:r3}];
el('modelCards').innerHTML=models.map(m=>{
if(!m.r)return'<div class="model-card" style="border-top:3px solid '+MCOLORS[m.name]+'"><div class="m-name" style="color:'+MCOLORS[m.name]+'">'+m.name+'</div><div class="m-wr" style="color:var(--muted)">0 trades</div><div class="m-ann">'+MSIGS[m.name]+'</div></div>';
const w=parseFloat(m.r.wr);
const p=sumPnl(m.trades);
return'<div class="model-card" style="border-top:3px solid '+MCOLORS[m.name]+'">'+'<div class="m-name" style="color:'+MCOLORS[m.name]+'">'+m.name+'</div>'+'<div class="m-wr '+(w>=60?'green':w>=50?'amber':'red')+'">'+w+'%WR</div>'+'<div class="m-pnl '+(p>=0?'green':'red')+'">'+fmtD(p)+' · '+m.trades.length+'t</div>'+'<div class="m-ann">$/day est: '+(m.r?'$'+m.r.perDay:'—')+'</div>'+'<div class="m-ann" style="margin-top:4px">'+MSIGS[m.name]+'</div></div>';
}).join('');

// FLAT P&L BOX
const ff=ft.length?ft[ft.length-1].fb:cap;
const tFlatTotal=ff-cap;
el('flatBox').innerHTML=
'<div class="pnl-row"><span class="pnl-lbl">Starting Account</span><span class="pnl-val">$'+cap+'</span></div>'+
'<div class="pnl-row"><span class="pnl-lbl">Contracts/Trade</span><span class="pnl-val">'+contracts+'</span></div>'+
'<div class="pnl-row"><span class="pnl-lbl">Fee/Contract</span><span class="pnl-val">$'+fee+'</span></div>'+
'<div class="pnl-row"><span class="pnl-lbl">Final Balance</span><span class="pnl-val '+(tFlatTotal>=0?'green':'red')+'">$'+ff.toFixed(2)+'</span></div>'+
'<div class="pnl-row"><span class="pnl-lbl">Total P&L</span><span class="pnl-val '+(tFlatTotal>=0?'green':'red')+'">'+fmtD(tFlatTotal)+'</span></div>'+
'<div class="pnl-row"><span class="pnl-lbl">Return on $'+cap+'</span><span class="pnl-val">'+Math.round(tFlatTotal/cap*100)+'%</span></div>'+
'<div class="pnl-row"><span class="pnl-lbl">Max Drawdown</span><span class="pnl-val '+(parseFloat(tDD)>20?'red':'amber')+'">'+tDD+'%</span></div>'+
'<div class="pnl-row"><span class="pnl-lbl">Max Loss Streak</span><span class="pnl-val">'+(rAll?rAll.maxStreak:'—')+'</span></div>'+
'<div class="pnl-row"><span class="pnl-lbl">Est $/day</span><span class="pnl-val '+(parseFloat(rAll?.perDay||0)>=0?'green':'red')+'">'+(rAll?'$'+rAll.perDay:'—')+'</span></div>'+
'<div class="pnl-row"><span class="pnl-lbl">Est $/yr (extrapolated)</span><span class="pnl-val '+(parseFloat(rAll?.perYear||0)>=7000?'green':parseFloat(rAll?.perYear||0)>=0?'amber':'red')+'">'+(rAll?fmtD(parseFloat(rAll.perYear))+'/yr':'—')+'</span></div>';

// COMPOUND P&L BOX
const cf=ct.length?ct[ct.length-1].cb:cap;
const tCompTotal=cf-cap;
el('compBox').innerHTML=
'<div class="pnl-row"><span class="pnl-lbl">Starting Account</span><span class="pnl-val">$'+cap+'</span></div>'+
'<div class="pnl-row"><span class="pnl-lbl">Strategy</span><span class="pnl-val amber">Scale contracts with balance</span></div>'+
'<div class="pnl-row"><span class="pnl-lbl">Final Balance</span><span class="pnl-val '+(tCompTotal>=0?'green':'red')+'">$'+cf.toFixed(2)+'</span></div>'+
'<div class="pnl-row"><span class="pnl-lbl">Total P&L</span><span class="pnl-val '+(tCompTotal>=0?'green':'red')+'">'+fmtD(tCompTotal)+'</span></div>'+
'<div class="pnl-row"><span class="pnl-lbl">Return</span><span class="pnl-val">'+Math.round(tCompTotal/cap*100)+'%</span></div>'+
'<div class="pnl-row" style="border-top:1px solid var(--border);margin-top:4px"><span class="pnl-lbl" style="color:var(--amber)">⚠ Compound is theoretical ceiling</span></div>';

// HOURLY BREAKDOWN (replacing monthly)
const byHour={};
ft.forEach(t=>{const h=t.ts.slice(11,13)+'h';if(!byHour[h])byHour[h]={trades:[],fp:0,models:new Set()};byHour[h].trades.push(t);byHour[h].fp+=t.pnl;byHour[h].models.add(t.model);});
let rb=cap,hrows='';
for(const h of Object.keys(byHour).sort()){
const hd=byHour[h];
const hw=hd.trades.filter(t=>t.pnl>0).length;
const hwr=Math.round(hw/hd.trades.length*100);
rb+=hd.fp;
hrows+='<tr><td>'+h+' UTC</td><td>'+hd.trades.length+'</td><td class="'+(hwr>=55?'green':'amber')+'">'+hwr+'%</td><td class="'+(hd.fp>=0?'green':'red')+'">'+fmtD(hd.fp)+'</td><td>$'+rb.toFixed(2)+'</td><td style="color:var(--muted);font-size:10px">'+'[...'+hd.models.size+' models]'+'</td></tr>';
}
el('monthTbl').innerHTML=hrows||'<tr><td colspan="6" style="color:var(--muted)">No trades</td></tr>';

// TRADE LOG TABS
el('tabs').innerHTML=
'<span class="tab active" onclick="showTab(\'all\',this)">All ('+ALL.length+')</span>'+
['M1','M2','M3'].map(n=>'<span class="tab" onclick="showTab(\''+n+'\',this)" style="border-color:'+MCOLORS[n]+'">'+n+' ('+ALL.filter(t=>t.model===n).length+')</span>').join('');

window._ft=ft;
window._ALL=ALL;
showTab('all');

lg('══════ RESULTS ══════','ok');
models.forEach(m=>{if(m.r)lg('  '+m.name+': '+m.trades.length+'t | '+m.r.wr+'%WR | '+fmtD(sumPnl(m.trades))+' | $'+m.r.perDay+'/day',parseFloat(m.r.wr)>=55?'ok':'warn');else lg('  '+m.name+': 0 trades','warn');});
lg('COMBINED: '+ALL.length+'t | '+(rAll?rAll.wr:0)+'%WR | '+fmtD(tFlat)+' | '+(rAll?'$'+rAll.perDay+'/day':''),'ok');
}

function showTab(tab,e2){
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
if(e2)e2.classList.add('active');
const ft=window._ft||[];
const filtered=tab==='all'?ft:ft.filter(t=>t.model===tab);
const MCOLORS={M1:'var(--coral)',M2:'var(--teal)',M3:'var(--blue)'};
const head='<div class="trow head"><span>Time</span><span>Model</span><span>Ticker</span><span>Entry</span><span>Exit</span><span>P&L</span><span>Balance</span></div>';
const rows=filtered.slice(0,200).map(t=>{
const w=t.pnl>0;
return'<div class="trow '+(w?'win':'loss')+'">'+'<span>'+t.time+'</span>'+'<span style="color:'+(MCOLORS[t.model]||'var(--muted)')+'">'+t.model+'</span>'+'<span style="color:var(--muted);font-size:9px">'+t.ticker.slice(-8)+'</span>'+'<span>$'+t.entry+'</span>'+'<span>$'+t.exitPrice+'</span>'+'<span class="'+(w?'green':'red')+'">'+fmtD(t.pnl)+'</span>'+'<span style="color:var(--muted);font-size:9px">$'+t.fb.toFixed(2)+'</span>'+'</div>';
}).join('');
const more=filtered.length>200?'<div style="text-align:center;padding:10px;color:var(--purple);font-family:\'Courier New\',monospace;font-size:11px">...'+( filtered.length-200)+' more trades</div>':'';
el('tlog').innerHTML=head+rows+more;
}
</script>
</body>
</html>
