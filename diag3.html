<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalshi Active BTC Diagnostic</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a14;color:#eee;font-family:ui-monospace,monospace;padding:14px;font-size:11px;line-height:1.5;max-width:900px;margin:0 auto}
h1{font-size:18px;color:#f7931a;margin-bottom:14px}
.btn{background:#f7931a;color:#000;border:none;padding:11px 20px;border-radius:6px;font-weight:600;font-size:13px;cursor:pointer;width:100%;margin-bottom:12px}
.card{background:#16162a;border:1px solid #2a2a40;border-radius:8px;padding:12px;margin-bottom:10px}
.sec{font-size:10px;color:#888;text-transform:uppercase;margin-bottom:8px;border-bottom:1px solid #2a2a40;padding-bottom:5px}
pre{background:#0a0a14;padding:8px;border-radius:4px;font-size:10px;overflow-x:auto;color:#aaa;white-space:pre-wrap;word-wrap:break-word}
.amber{color:#ffb340}
.green{color:#00e5aa}
.muted{color:#666}
.tbl{width:100%;border-collapse:collapse;font-size:10px;margin-top:6px}
.tbl th{text-align:left;padding:5px;background:#0d0d18;color:#888;font-size:9px}
.tbl td{padding:5px;border-bottom:1px solid #1a1a28;font-family:monospace}
</style>
</head>
<body>
<h1>Find Active BTC Contracts</h1>
<button class="btn" onclick="run()">Find Live Contracts</button>
<div id="out"></div>
<script>
async function api(b){const r=await fetch('/api/proxy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});return r.json()}
async function run(){
  const out=document.getElementById('out');
  out.innerHTML='<div class="card muted">Loading...</div>';
  let html='';

const now=Date.now();
const series=[‘KXBTC15M’,‘KXBTCD’,‘KXBTC’,‘BTCD’];

for(const s of series){
const evts=await api({_kalshi:true,url:‘https://api.elections.kalshi.com/trade-api/v2/events?series_ticker=’+s+’&status=open&limit=20’});
html+=’<div class="card"><div class="sec">’+s+’ open events</div>’;
if(evts.error){
html+=’<pre>Error: ‘+JSON.stringify(evts).slice(0,300)+’</pre>’;
}else{
const list=evts.events||[];
html+=’<div>Returned ‘+list.length+’ events</div>’;

```
  const enriched=list.map(e=>{
    const sd=e.strike_date?new Date(e.strike_date):null;
    const minsToResolve=sd?Math.round((sd.getTime()-now)/60000):null;
    return {ticker:e.event_ticker,sd:e.strike_date,mins:minsToResolve,title:(e.title||'').slice(0,40)};
  }).sort((a,b)=>(a.mins||999999)-(b.mins||999999));
  
  const nearTerm=enriched.filter(e=>e.mins!==null && e.mins>0 && e.mins<=120);
  html+='<div class="green">Near-term (next 2hr): '+nearTerm.length+'</div>';
  
  if(enriched.length){
    html+='<table class="tbl"><thead><tr><th>Event</th><th>Resolves</th><th>Mins</th></tr></thead><tbody>';
    for(const e of enriched.slice(0,8)){
      const cls=e.mins!==null && e.mins>0 && e.mins<=120?'green':'';
      html+='<tr><td class="'+cls+'">'+e.ticker+'</td><td>'+(e.sd||'-').slice(0,16)+'</td><td>'+(e.mins!==null?e.mins+'m':'?')+'</td></tr>';
    }
    html+='</tbody></table>';
  }
}
html+='</div>';
```

}

// Pull one near-term event ladder if found
// Try KXBTC15M first
const evts15=await api({_kalshi:true,url:‘https://api.elections.kalshi.com/trade-api/v2/events?series_ticker=KXBTC15M&status=open&limit=20’});
if(evts15.events && evts15.events.length){
const sorted=evts15.events.map(e=>{
const sd=e.strike_date?new Date(e.strike_date):null;
return {e,mins:sd?Math.round((sd.getTime()-now)/60000):null};
}).filter(x=>x.mins>0).sort((a,b)=>a.mins-b.mins);

```
if(sorted.length){
  const target=sorted[0];
  const ladder=await api({_kalshi:true,url:'https://api.elections.kalshi.com/trade-api/v2/events/'+target.e.event_ticker+'?with_nested_markets=true'});
  const markets=(ladder.event && ladder.event.markets)||ladder.markets||[];
  
  html+='<div class="card"><div class="sec">SAMPLE LADDER: '+target.e.event_ticker+' (resolves in '+target.mins+'m)</div>';
  html+='<div>'+(target.e.title||'')+'</div>';
  html+='<div class="muted">'+markets.length+' strikes</div>';
  
  if(markets.length){
    html+='<table class="tbl"><thead><tr><th>Strike</th><th>YES bid</th><th>YES ask</th><th>NO bid</th><th>Vol</th><th>OI</th></tr></thead><tbody>';
    for(const m of markets.slice(0,15)){
      html+='<tr>';
      html+='<td>'+(m.subtitle||m.yes_sub_title||'-').slice(0,20)+'</td>';
      html+='<td>$'+(m.yes_bid_dollars||'0')+'</td>';
      html+='<td class="amber">$'+(m.yes_ask_dollars||'0')+'</td>';
      html+='<td>$'+(m.no_bid_dollars||'0')+'</td>';
      html+='<td>'+(m.volume_fp||'0')+'</td>';
      html+='<td>'+(m.open_interest_fp||'0')+'</td>';
      html+='</tr>';
    }
    html+='</tbody></table>';
  }
  html+='</div>';
}
```

}

out.innerHTML=html;
}
run();
</script>

</body>
</html>
